---
- name: Deploy hardened SSH daemon drop-in configuration
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0600'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
      MaxSessions 2
      LoginGraceTime 30
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowTcpForwarding no
      AllowAgentForwarding no
      X11Forwarding no
      TCPKeepAlive no
      Compression no
      UseDNS no
      LogLevel VERBOSE
      Banner /etc/issue.net
  notify: Validate and reload ssh

- name: Enforce strict permissions on main sshd_config
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'

- name: Ensure SSH service is running and enabled
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: yes
